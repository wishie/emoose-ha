# Mosquitto bridge for Option B: your local broker mirrors the station's topics from the
# vendor's cloud broker using the station's own login. Put this file where your Mosquitto
# loads extra config (for example a conf.d/ folder pulled in with include_dir).
#
# Fill in the three values marked CHANGE_ME from the CONNECT packet your own station sends
# (capture it, then read the MQTT username and password in Wireshark). Do not publish them.

connection emoose-cloud
address CHANGE_ME_BROKER_ADDRESS:1883
bridge_protocol_version mqttv311
try_private false
cleansession true
start_type automatic
keepalive_interval 60
notifications false

remote_username CHANGE_ME_USERNAME
remote_password CHANGE_ME_PASSWORD
# Must differ from the station's own client id, or the broker drops the station.
remote_clientid ha-bridge-x300

# Replace 3768 with YOUR device id (it is in the station's topic names). Local topics become
# emoose/report/request etc.; set the integration's topic prefix to "emoose".
topic report/request   in  0 emoose/ $oc/devices/3768/
topic command/response in  0 emoose/ $oc/devices/3768/
topic command/request  out 0 emoose/ $oc/devices/3768/
