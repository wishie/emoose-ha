# Mosquitto config for Option A (DNS redirect): the station connects to YOUR broker.
#
# Put your own DNS record in place first: app.emoose.com -> the IP of this broker.
# The station connects with its own built-in username/password over plain MQTT 3.1.1 on
# port 1883, so this listener accepts any login. Keep it on your LAN only.

persistence true
listener 1883
allow_anonymous true
